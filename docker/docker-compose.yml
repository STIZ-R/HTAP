version: '3.8'

services:
  postgres:
    image: debezium/postgres:15
    container_name: htap-postgres
    environment:
      POSTGRES_USER: htap
      POSTGRES_PASSWORD: htap
      POSTGRES_DB: htapdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: htap-clickhouse
    ports:
      - "8123:8123"    # HTTP
      - "9000:9000"    # Native
    depends_on:
      - kafka
    environment:
      CLICKHOUSE_DB: default
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/kafka.xml


  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: htap-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: htap-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  connect:
    image: debezium/connect:2.6
    container_name: htap-connect
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium-config
      OFFSET_STORAGE_TOPIC: debezium-offsets
      STATUS_STORAGE_TOPIC: debezium-status
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    volumes:
      - ./connectors:/kafka/connectors

  init-connect:
    image: curlimages/curl:8.2.1
    depends_on:
      - connect
    volumes:
      - ./connectors:/kafka/connectors
      - ./init-connect.sh:/init-connect.sh
    entrypoint: [ "/bin/sh", "/init-connect.sh" ]

volumes:
  postgres_data:
  clickhouse_data:
